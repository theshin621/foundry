<script>
(function(){
  try{
    if(navigator.webdriver) return;
    var body = JSON.stringify({ path: location.pathname + location.search, self: /(^|[?&])self=1([&#]|$)/.test(location.search) });
    if(navigator.sendBeacon){ navigator.sendBeacon('/_b', new Blob([body], {type:'text/plain'})); }
    else { fetch('/_b', {method:'POST', body:body, keepalive:true, headers:{'content-type':'text/plain'}}).catch(function(){}); }
  }catch(e){}
})();
</script>
