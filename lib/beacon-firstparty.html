<!-- lib/beacon-firstparty.html — FIRST-PARTY cookieless beacon. NOT YET LIVE.
     Branch infra/beacon-firstparty, unmerged, unverified. See src/worker.js for the
     Cloudflare provisioning step that must happen before this can deploy at all.

     WHY A SECOND BEACON. lib/beacon.html is Cloudflare Web Analytics — third-party
     (static.cloudflareinsights.com), pageview-only, and readable only by logging into
     Cloudflare's dashboard, which a scheduled fire cannot do. So the loop can be
     measured but cannot READ its own measurement, which makes every kill-criterion and
     every stop-condition threshold un-evaluable from inside a run. This beacon fixes
     exactly that: first-party POST, counts readable at /_b/stats by anyone including a
     fire. The two can run side by side; neither sets a cookie.

     PRIVACY (binding, PLAYBOOK §4 — POPIA-safe by construction):
       * no cookies, no localStorage, no sessionStorage, no fingerprinting
       * the payload is {path} and nothing else — no referrer, no screen size, no UA,
         no timing, no id of any kind
       * the server stores one integer per (UTC date, path). No IP is stored or hashed.
       * ?self=1 on the URL marks Theshin's own traffic and is dropped server-side
       * fire-and-forget: it never blocks paint and never retries

     EVERY ship inlines the <script> below immediately before </body>, in addition to
     lib/beacon.html, until one of the two is retired. -->
<script>
(function(){
  try{
    if(navigator.webdriver) return;                 // automated browser, don't count
    var p = location.pathname + location.search;    // search kept ONLY so ?self=1 is visible
    var body = JSON.stringify({ path: p, self: /(^|[?&])self=1([&#]|$)/.test(location.search) });
    if(navigator.sendBeacon){
      navigator.sendBeacon('/_b', new Blob([body], {type:'text/plain'}));
    } else {
      fetch('/_b', {method:'POST', body:body, keepalive:true, headers:{'content-type':'text/plain'}}).catch(function(){});
    }
  }catch(e){}
})();
</script>
