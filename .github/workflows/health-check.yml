# .github/workflows/health-check.yml
#
# WHY THIS FILE LIVES IN tools/ — see the header of ship-preview.yml. The PAT
# cannot push anything under .github/workflows/, by design.
#
# WHAT IT DOES
# The build sandbox cannot reach the live origin (WebFetch is provenance-gated in
# unattended runs; *.workers.dev is CONNECT 403), so no scheduled run can confirm
# by itself that the live site renders. A GitHub-hosted runner can, for free,
# with no secret. This probes the hub and every ship the ledger marks live, then
# commits the result to public/health.json — which the next run reads as its
# live-render signal, and the dashboard renders as a status pill.

name: health check

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Give the Workers build time to land
        if: github.event_name == 'push'
        run: sleep 120

      - name: Probe the hub and every live ship path
        env:
          BASE: https://tailorfarms.com
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, datetime

          base = os.environ['BASE'].rstrip('/')

          def probe(path):
              url = base + path
              req = urllib.request.Request(url, headers={'User-Agent': 'foundry-health-check'})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      # 2026-08-10: was 200000. The beacon snippet sits just before </body>, so the
                      # cap is a tail cut: the first page over the limit would silently report
                      # has_beacon:false while fully instrumented. Largest page today is ~103KB.
                      body = r.read(4000000).decode('utf-8', 'replace')
                      # 2026-08-10: this used to look for 'cloudflareinsights.com', the
                      # THIRD-PARTY beacon that ship 008 replaced. Every page reported
                      # has_beacon: true while the field measured a script the loop no
                      # longer depends on. It now looks for the first-party POST target.
                      #
                      # 2026-08-13 (ship 014): RENAMED has_beacon -> beacon_bytes_served,
                      # because the old name asserted a browser BEHAVIOUR and the code is
                      # a substring test — the construct BOTTLENECKS #1 clause 3 forbids.
                      # A snippet inside <template>, <noscript>, an HTML comment or a
                      # <script type="application/json"> leaves this string in `body` with
                      # the beacon stone dead (incidents #4 and #009). The check is KEPT,
                      # because "did the CDN serve the bytes we built" is a real and
                      # useful question — it just is not the liveness question. Liveness
                      # is answered by oracles/beacon-liveness in the step below, which
                      # executes the page in Chromium. Two claims, two names, no overlap.
                      return {'path': path, 'http': r.status, 'ok': r.status == 200,
                              'bytes': len(body), 'beacon_bytes_served': "'/_b'" in body}
              except urllib.error.HTTPError as e:
                  return {'path': path, 'http': e.code, 'ok': False, 'bytes': 0,
                          'beacon_bytes_served': False}
              except Exception as e:
                  return {'path': path, 'http': 0, 'ok': False, 'error': type(e).__name__,
                          'bytes': 0, 'beacon_bytes_served': False}

          try:
              ships = json.load(open('ledger.json')).get('ships', [])
          except Exception:
              ships = []

          out = {
              'checked_utc': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'commit': os.environ.get('GITHUB_SHA', '')[:7],
              'base': base,
              'hub': probe('/'),
              'ships': [],
          }
          for s in ships:
              if s.get('status') != 'live':
                  continue
              # 2026-08-10: infra rows have no page of their own. Row 8 (beacon-firstparty)
              # is inlined into the other pages, so probing /008-beacon-firstparty/ returned
              # a permanent 404 and health.json reported a failure that could never clear.
              if s.get('kind') == 'infra':
                  continue
              path = '/' if s.get('slug') == 'hub' else '/%03d-%s/' % (s['n'], s['slug'])
              r = probe(path)
              r['n'] = s['n']
              r['slug'] = s.get('slug')
              r['status'] = s.get('status')
              out['ships'].append(r)

          os.makedirs('public', exist_ok=True)
          json.dump(out, open('public/health.json', 'w'), indent=1)
          print(json.dumps(out, indent=1))
          PY

      # ---------------------------------------------------------------- ship 014
      # The liveness claim, answered by a browser instead of by a substring. This
      # step NEVER fails the job: an oracle that cannot run must leave an honest
      # CANNOT-CERTIFY in health.json, exactly as lib/beacon_stats.py leaves an
      # {"error", "as_of"} block rather than a null. A red X here would also block
      # the health commit, losing the HTTP probe that did succeed.
      - name: Measure beacon LIVENESS in a real browser
        continue-on-error: true
        run: |
          set +e
          pip install playwright --quiet --disable-pip-version-check
          python3 -m playwright install --with-deps chromium
          python3 oracles/beacon-liveness/oracle.py --json > /tmp/liveness.json
          echo "oracle exit: $?"
          cat /tmp/liveness.json

      - name: Fold the liveness verdict into health.json
        if: always()
        run: |
          python3 - <<'PY'
          import datetime, json, os

          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          try:
              health = json.load(open('public/health.json'))
          except Exception as e:
              raise SystemExit('no health.json to fold into: %r' % e)

          try:
              rep = json.load(open('/tmp/liveness.json'))
              if not isinstance(rep, dict) or 'verdict' not in rep:
                  raise ValueError('report has no verdict')
              block = {
                  'as_of': now,
                  'verdict': rep['verdict'],
                  'oracle': 'oracles/beacon-liveness',
                  'failing_predicates': [p['id'] for p in rep.get('predicates', [])
                                         if not p.get('ok')],
                  'paths': {r['path']: {'delivered': len(r.get('delivered', [])),
                                        'http': r.get('http')}
                            for r in rep.get('records', [])},
              }
          except Exception as e:
              # Unmeasured and measured-dead are DIFFERENT values. Never collapse them.
              block = {'as_of': now, 'verdict': 'CANNOT-CERTIFY',
                       'oracle': 'oracles/beacon-liveness',
                       'error': '%s: %s' % (type(e).__name__, e)}

          health['beacon_liveness'] = block
          json.dump(health, open('public/health.json', 'w'), indent=1)
          print(json.dumps(block, indent=1))
          PY

      - name: Commit the result if it changed
        run: |
          set -euo pipefail
          git config user.name  'foundry health-check'
          git config user.email 'health-check@users.noreply.github.com'
          git add public/health.json
          if git diff --cached --quiet; then
            echo "health.json unchanged"
            exit 0
          fi
          git commit -m "health: live-site probe [skip ci]"
          # 2026-08-10: beacon-stats.yml also writes to this branch, and both fire on the
          # same push, so a bare `git push` loses the race and fails the run. Rebase and
          # retry instead of failing on a conflict that is not a conflict.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 5))
          done
          echo "push still failing after 5 attempts" >&2
          exit 1
