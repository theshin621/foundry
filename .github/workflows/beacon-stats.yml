# .github/workflows/beacon-stats.yml
#
# WHY THIS FILE EXISTS  (BOTTLENECKS.md entry #2, filed 2026-08-10)
# The loop cannot read its own instrument. Every kill-criterion in ledger.json, and
# Branch B of the 30-day stop-condition (>=250 qualified visits, >=3 distinct days,
# trailing 7d), is denominated in beacon visits served at https://tailorfarms.com/_b/stats
# -- and an unattended scheduled fire CANNOT fetch it. Measured three times, most
# recently 2026-08-10T02:2xZ: WebFetch returns PROVENANCE_REQUIRED ("the permission
# request for this URL was not answered in time") because there is nobody in the
# session to approve the prompt. That is permanent for unattended runs, not transient.
#
# Ship 008 built the endpoint so "a scheduled fire can READ its own instrument instead
# of only feeding Cloudflare's dashboard" (ledger row 8). It built the endpoint and
# stopped one step short: the reader still cannot reach it.
#
# HOW THIS FIXES IT
# Exactly the way health-check.yml already solved the same problem for live-render
# checks: a GitHub-hosted runner sits OUTSIDE the sandbox, reaches the live origin for
# free with no secret, and commits what it saw into the repo. The next fire then reads
# its instrument out of git instead of over the network. No new mechanism is invented
# here -- one proven path is pointed at one more endpoint.
#
# WHAT THE NEXT FIRE MUST DO WITH THE RESULT
# Do NOT trust this file because it exists. Run the oracle:
#     python3 oracles/beacon-stats-relay/oracle.py public/beacon-stats.json
# It refuses anything a sandbox fire could have fabricated -- see that file's header.
# PLAYBOOK: signal blocks are instrument-read, never claimed, never hand-invented.

name: beacon stats

on:
  schedule:
    # 01:35 UTC = 03:35 SAST, ~25 min before the 04:00 SAST daily fire, so the fire
    # always finds a reading from the same night rather than one 24h old.
    - cron: '35 1 * * *'
  push:
    branches: [main, 'infra/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beacon-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the live beacon and record it with provenance
        env:
          SOURCE_URL: https://tailorfarms.com/_b/stats
        run: |
          python3 - <<'PY'
          import json, os, datetime, urllib.request, urllib.error

          url = os.environ['SOURCE_URL']

          # Provenance is the whole point of this file. A sandbox fire can write any
          # numbers it likes into public/beacon-stats.json; what it cannot do is make
          # api.github.com agree that an Actions run produced them. These five fields
          # are what the oracle checks against GitHub, so they are recorded even when
          # the fetch fails -- a failed reading must be as attributable as a good one.
          prov = {
              'run_id':        int(os.environ.get('GITHUB_RUN_ID', 0)),
              'run_url':       '%s/%s/actions/runs/%s' % (
                                   os.environ.get('GITHUB_SERVER_URL', 'https://github.com'),
                                   os.environ.get('GITHUB_REPOSITORY', ''),
                                   os.environ.get('GITHUB_RUN_ID', '')),
              'run_attempt':   int(os.environ.get('GITHUB_RUN_ATTEMPT', 1)),
              'repo':          os.environ.get('GITHUB_REPOSITORY', ''),
              'workflow_path': '.github/workflows/beacon-stats.yml',
              'head_sha':      os.environ.get('GITHUB_SHA', ''),
              'runner':        'ubuntu-latest',
          }

          out = {
              'fetched_utc': datetime.datetime.now(datetime.timezone.utc)
                                 .strftime('%Y-%m-%dT%H:%M:%SZ'),
              'source_url': url,
              'provenance': prov,
          }

          req = urllib.request.Request(url, headers={
              'User-Agent': 'foundry-beacon-stats-relay',
              'Accept': 'application/json',
          })
          try:
              with urllib.request.urlopen(req, timeout=25) as r:
                  body = r.read(2_000_000).decode('utf-8', 'replace')
                  out['http'] = r.status
                  # A 200 carrying an HTML shell is NOT a reading. Parse or fail loudly;
                  # never store an un-parsed body as if it were the instrument.
                  try:
                      out['stats'] = json.loads(body)
                      out['ok'] = (r.status == 200)
                      if not out['ok']:
                          out['ok'] = False
                          out.pop('stats', None)
                          out['error'] = 'non-200 with a JSON body: HTTP %s' % r.status
                  except ValueError:
                      out['ok'] = False
                      out['error'] = ('body is not JSON (first 200 bytes: %r)'
                                      % body[:200])
          except urllib.error.HTTPError as e:
              out['http'] = e.code
              out['ok'] = False
              out['error'] = 'HTTP %s from the beacon endpoint' % e.code
          except Exception as e:
              out['http'] = 0
              out['ok'] = False
              out['error'] = '%s: %s' % (type(e).__name__, e)

          os.makedirs('public', exist_ok=True)
          with open('public/beacon-stats.json', 'w') as f:
              json.dump(out, f, indent=1, sort_keys=True)
          print(json.dumps(out, indent=1, sort_keys=True)[:4000])
          PY

      - name: Commit the reading
        run: |
          set -euo pipefail
          git config user.name  'foundry beacon-stats'
          git config user.email 'beacon-stats@users.noreply.github.com'
          git add public/beacon-stats.json
          if git diff --cached --quiet; then
            echo "beacon-stats.json unchanged"
            exit 0
          fi
          # [skip ci] so committing a reading does not trigger another reading.
          git commit -m "beacon: instrument reading [skip ci]"
          git push origin HEAD:"${GITHUB_REF_NAME}"
